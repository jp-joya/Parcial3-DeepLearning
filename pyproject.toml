[project]
name = "har-parcial3"
version = "0.1.0"
description = "Comparación reproducible de RNN, LSTM y CNN-LSTM en UCI HAR"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.5,<3", "numpy>=1.26,<3", "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4",
  "jupyterlab>=4,<5", "nbformat>=5.10,<6", "pytest>=8,<10",
]
[tool.uv]
package = false
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
